socket_path = "/run/sandbox-broker.sock"
socket_mode = "0600"
[limits]
max_concurrent = 48
max_total_creates = 0
default_cpu = 1.0
max_cpu = 16.0
default_memory_mb = 2048
max_memory_mb = 32768
default_timeout_s = 7800
max_timeout_s = 7800
idle_timeout_s = 0
default_exec_timeout_s = 7800
max_exec_timeout_s = 14400
budget_sandbox_seconds = 200000
create_timeout_s = 1800
max_file_bytes = 268435456
max_output_bytes = 33554432
max_context_bytes = 268435456
max_context_file_bytes = 268435456
[images]
allow = ["alexgshaw/*"]
allow_any_build_context = true
[sandbox]
network = "egress"
hostname = ""
normalize_prompt = false
