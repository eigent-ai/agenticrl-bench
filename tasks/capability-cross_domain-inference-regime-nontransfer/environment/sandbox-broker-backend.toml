# Sandbox gate backend config (installed as /etc/sandbox-broker/backend.toml, root:root 0600; daemon only).
# The platform is chosen by task.toml (SANDBOX_GATE_PROVIDER), never here; one table per platform.

[modal]
app_name = "tb-eval-sandboxes"

[modal.parent_network]
manage_allowlist = false  # this container's network is the task's per-phase policy (task.toml)
domains = ["api.modal.com"]  # used only with manage_allowlist
refresh_interval_s = 60

[daytona]

[credentials]
source = "env"  # `start` captures the provider + SANDBOX_GATE_TOKEN_ID/SECRET or SANDBOX_GATE_CRED_*, writes them 0600, drops them
