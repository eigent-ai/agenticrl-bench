[global]
   workgroup = WORKGROUP
   server string = File Server
   server roll = standalone
   log file = /var/log/samba/log.%m
   max log size = 1000
   printing = cups
   printcap name = cups
   load printers = Yes
   security = user
   passdb backend = tdbsam

[projects]
   comment = Development Projects
   path = /srv/samba/project
   browseable = Yes
   valid users = devuser
   write list = devuser
   create mask = 0664
   directory mask = 0775

[public]
   comment = Public Share
   path = /srv/samba/public
   browseable = Yes
   guest ok = Yes
   read only = No
   create mask = 0666
   directory mask = 0777

[backups]
   comment = Project Backups
   path = /srv/samba/backups
   browseable = Yes
   valid users = devuser
   read only = No
   create mask = 0644
   directory mask = 0755
