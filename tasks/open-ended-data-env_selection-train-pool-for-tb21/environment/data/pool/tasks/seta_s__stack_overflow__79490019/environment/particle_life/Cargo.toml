[package]
name = "particle_life"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[features]
headless = []

[profile.release]
opt-level = 1

[[bin]]
name = "particle_life"
path = "src/main.rs"
