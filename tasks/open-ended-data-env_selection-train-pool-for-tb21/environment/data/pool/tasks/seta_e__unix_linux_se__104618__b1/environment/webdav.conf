DavLockDB /var/lib/dav/DavLock

<VirtualHost *:80>
    ServerAdmin admin@localhost
    DocumentRoot /var/www/html

    Alias /webdav /backup

    <Directory /backup>
        DAV On
        AuthType Basic
        AuthName "WebDAV"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
