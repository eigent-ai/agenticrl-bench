<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html/secure

    SSLEngine on
    SSLCertificateFile /etc/ssl/local/server.crt
    SSLCertificateKeyFile /etc/ssl/local/server.key

    <Directory /var/www/html/secure>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
