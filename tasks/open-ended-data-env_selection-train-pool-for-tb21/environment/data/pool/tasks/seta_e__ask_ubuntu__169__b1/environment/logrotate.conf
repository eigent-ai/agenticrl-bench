# see "man logrotate" for details
# Global options
weekly
rotate 4
create
dateext

# use compressed log files
#compress

# packages can drop config info into this directory
include /etc/logrotate.d

# system-specific logs may also be configured here
/var/log/wtmp {
    monthly
    create 0664 root utmp
    minsize 1M
    rotate 1
}

/var/log/btmp {
    missingok
    monthly
    create 0600 root utmp
    rotate 1
}
