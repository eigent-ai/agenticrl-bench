# Custom log routing for application services
# Routes messages from specific programs to dedicated log files

# Route webapp messages to dedicated log file
:syslogtag, isequal, "webapp" /var/log/app/webapp.log

# Route auth service messages to dedicated log file
:programname, isequal, "Authsvc" /var/log/app/authsvc.log

# Route payment service messages to dedicated log file
:programname, isequal, "paymentsvc" /var/log/app/paymentsvc.log
