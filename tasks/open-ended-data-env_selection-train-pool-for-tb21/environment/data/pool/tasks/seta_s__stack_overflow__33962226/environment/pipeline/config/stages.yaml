stages:
  - name: normalize
    module: stages.normalize
    params:
      epsilon: 0
      columns:
        - feature_1
        - feature_2
        - feature_3
        - feature_4
        - feature_5

  - name: scale
    module: stages.scaling
    params:
      target_range: [0, 1]

  - name: transform
    module: stages.transform
    params:
      method: polynomial
      degree: 2

  - name: aggregate
    module: stages.aggregate
    params:
      method: mean

chunk_size: 5000
