[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engcalc"
version = "0.3.1"
description = "Engineering cross-section analysis and material property library"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
