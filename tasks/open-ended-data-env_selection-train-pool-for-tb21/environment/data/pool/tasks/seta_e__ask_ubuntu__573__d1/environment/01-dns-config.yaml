network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      addresses:
        - REPLACE_ETH0_ADDRESS
      nameservers:
        addresses:
          - REPLACE_ETH0_DNS1
          - REPLACE_ETH0_DNS2
        search:
          - REPLACE_ETH0_SEARCH_DOMAIN1
          - REPLACE_ETH0_SEARCH_DOMAIN2
      routes:
        - to: default
          via: REPLACE_ETH0_GATEWAY
          metric: 100
    eth1:
      addresses:
        - REPLACE_ETH1_ADDRESS
      nameservers:
        addresses:
          - REPLACE_ETH1_DNS1
          - REPLACE_ETH1_DNS2
        search: []
      routes:
        - to: default
          via: REPLACE_ETH1_GATEWAY
          metric: 200
