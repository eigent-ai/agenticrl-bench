#!/bin/bash
# memwatch configuration file
# Memory monitoring toolkit settings

# Page size configuration
PAGE_SIZE=2048
PAGE_SHIFT=11

# Report settings
REPORT_DIR="/opt/memwatch/output"
LOG_LEVEL="INFO"

# Thresholds for alerts (in percentage)
FREE_MEM_WARN_THRESHOLD=20
FREE_MEM_CRIT_THRESHOLD=10

# Shared memory test segment
SHM_TEST_PATH="/dev/shm/memwatch_test"
SHM_TEST_SIZE=5000

# vmstat fields to monitor
VMSTAT_FIELDS="nr_free_pages nr_inactive_anon nr_active_anon nr_inactive_file nr_active_file"
