# Artifact Retention Configuration
# Format: directory_name:regex_pattern
# Files matching ANY listed pattern for their directory are RETAINED
# All non-matching files/dirs are REMOVED

webapp:release-v.*\.(tar\.gz)$
webapp:release notes
webapp:\.release-metadata\.json
api-service:api-v.*\.jar$
api-service:\.deploy-config\.yaml
data-pipeline:pipeline-v.*\.whl$
data-pipeline:dist-info\.yaml
mobile-app:app-release-.*\.apk$
mobile-app:proguard-mapping\.txt
mobile-app:\.signing-config

[global]
\.gitkeep$
