plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'com.scheduler.App'
}

tasks.withType(JavaExec) {
    systemProperty 'user.timezone', 'UTC'
    workingDir = projectDir
}

test {
    systemProperty 'user.timezone', 'UTC'
    workingDir = projectDir
}
