[engine]
name = "GameEngine"
version = "0.1.0"
tick_rate = 30

[combat]
damage_formula = "multiplicative"
critical_hit_multiplier = 2.0
miss_chance = 0.05

[entities]
max_components = 8
allow_dynamic_types = true
default_hp = 100

[ai]
simulation_max_ticks = 20
behavior_update_interval = 1
patrol_speed = 1.0

[persistence]
db_name = "gamestate.db"
auto_save_interval = 300
