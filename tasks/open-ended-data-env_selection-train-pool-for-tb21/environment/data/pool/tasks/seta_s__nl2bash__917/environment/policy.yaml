compound_extensions:
  - tar.gz
  - tar.bz2
  - min.js
  - min.css
  - d.ts

global_allowed:
  - py
  - js
  - ts
  - json
  - yaml
  - toml
  - md
  - txt
  - sh

directory_rules:
  src/:
    additional_allowed:
      - go
      - rs
      - d.ts
      - min.js
  config/:
    additional_allowed:
      - ini
      - env
  build/:
    additional_allowed:
      - o
      - so
      - class
  docs/:
    additional_allowed:
      - pdf
  scripts/:
    additional_allowed:
      - bash

no_extension_policy:
  default: allow
  build/: deny

violation_reasons:
  extension_not_allowed: "Extension is not in the allowed list for this directory"
  directory_restricted: "Extension is globally allowed but denied in this specific directory"
  no_extension_denied: "File has no extension and directory policy denies extensionless files"
