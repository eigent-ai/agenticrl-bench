server {
    listen 8080;
    server_name localhost;

    root /var/www/assets;

    location /assets/public/ {
        alias /var/www/assets/public/;
    }

    location /assets/protected/ {
        alias /var/www/assets/protected/;
        valid_referers server_names http://localhost:8080/portal/;
        if ($invalid_referer) {
            return 403;
        }
    }

    location /assets/fonts/ {
        return 302 /assets/protected/fonts.css;
    }

    location /portal/ {
        alias /var/www/assets/portal/;
        index index.html;
    }
}
