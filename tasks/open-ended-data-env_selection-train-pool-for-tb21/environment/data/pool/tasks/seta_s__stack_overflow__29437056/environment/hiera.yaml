---
version: 5

defaults:
  datadir: /etc/puppet/hieradata
  data_hash: yaml_data

hierarchy:
  - name: "Role data"
    path: "role/webserver.yaml"
    lookup_key: eyaml_lookup_key
    options:
      pkcs7_private_key: /etc/puppet/keys/private_key.pkcs7.pem
      pkcs7_public_key: /etc/puppet/keys/public_key.pkcs7.pem

  - name: "Common data"
    path: "common.yaml"
