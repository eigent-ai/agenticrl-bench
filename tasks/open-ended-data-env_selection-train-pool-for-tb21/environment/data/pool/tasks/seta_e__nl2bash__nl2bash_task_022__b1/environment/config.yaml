# Logserver Configuration
server:
  host: 0.0.0.0
  port: 8080
  workers: 4

logging:
  level: INFO
  format: "[%(asctime)s] [%(levelname)s] %(name)s: %(message)s"
  rotation:
    max_size_mb: 100
    keep_count: 5

alerts:
  enabled: true
  threshold: 100
  recipients:
    - admin@example.com
    - ops@example.com
