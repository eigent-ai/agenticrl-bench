# Minimal rsyslog configuration for Docker (no systemd, no kernel logging)
# Load the unix socket input module to receive local syslog messages via /dev/log
module(load="imuxsock")

# Default log format
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat

# Include drop-in configuration files
$IncludeConfig /etc/rsyslog.d/*.conf

# Default catch-all rules
auth,authpriv.*            /var/log/auth.log
*.*;auth,authpriv.none     /var/log/syslog
