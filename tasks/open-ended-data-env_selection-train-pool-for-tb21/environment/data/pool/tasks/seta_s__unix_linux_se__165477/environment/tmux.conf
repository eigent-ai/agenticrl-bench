# Terminal settings
set -g default-terminal "xterm-256color"
set -sg escape-time 1000

# Prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Window splitting
bind | split-window -h
bind - split-window -v

# Mouse support
set -g mouse on

# Status bar
set -g status-bg black
set -g status-fg white
