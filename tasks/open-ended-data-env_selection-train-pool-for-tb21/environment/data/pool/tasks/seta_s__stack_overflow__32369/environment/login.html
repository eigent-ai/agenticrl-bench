<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSecure Portal - Login</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>MedSecure Health Portal</h1>
            <p>Secure access to patient records and clinical data</p>
        </header>
        <main>
            <div class="login-card">
                <h2>Staff Login</h2>
                <form method="post" action="/auth/login">
                    <div class="form-group">
                        <label for="username">Employee ID</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn-primary">Sign In</button>
                    </div>
                </form>
                <p class="help-link"><a href="/auth/forgot-password">Forgot password?</a></p>
            </div>
        </main>
        <footer>
            <p>&copy; 2025 MedSecure Health Systems. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
