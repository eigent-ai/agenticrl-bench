scanner:
  name: "Healthcare Security Compliance Scanner"
  version: "1.0"
  description: "Checks HTML templates for password-saving prevention measures"

rules:
  - id: "R1"
    name: "Form Autocomplete Off"
    description: >
      All <form> elements that contain password input fields must have
      the autocomplete="off" attribute set to prevent browsers from
      caching or suggesting saved credentials.
    check: "form_autocomplete_off"
    severity: "critical"

  - id: "R2"
    name: "Input Autocomplete Off"
    description: >
      All <input type="password"> elements must have autocomplete="off"
      set directly on the element to ensure individual field compliance
      even if browser ignores form-level settings.
    check: "input_autocomplete_off"
    severity: "critical"

  - id: "R3"
    name: "Readonly Workaround"
    description: >
      For modern browser compatibility (Chrome 55+, Firefox 38+), all
      password inputs should use the readonly attribute combined with an
      onfocus handler that calls removeAttribute('readonly'). This
      prevents autofill in browsers that ignore autocomplete="off".
    check: "readonly_workaround"
    severity: "high"
