<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSecure Portal - New Account Registration</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>MedSecure Health Portal</h1>
            <p>New staff account registration</p>
        </header>
        <main>
            <div class="register-card">
                <h2>Create Account</h2>
                <form method="post" action="/auth/register" autocomplete="on">
                    <div class="form-group">
                        <label for="full_name">Full Name</label>
                        <input type="text" id="full_name" name="full_name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="employee_id">Employee ID</label>
                        <input type="text" id="employee_id" name="employee_id" required>
                    </div>
                    <div class="form-group">
                        <label for="department">Department</label>
                        <select id="department" name="department">
                            <option value="">Select Department</option>
                            <option value="cardiology">Cardiology</option>
                            <option value="radiology">Radiology</option>
                            <option value="oncology">Oncology</option>
                            <option value="pediatrics">Pediatrics</option>
                            <option value="emergency">Emergency Medicine</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required minlength="12">
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn-primary">Register</button>
                    </div>
                </form>
            </div>
        </main>
        <footer>
            <p>&copy; 2025 MedSecure Health Systems. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
