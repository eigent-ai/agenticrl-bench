<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSecure Portal - Change Password</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>MedSecure Health Portal</h1>
            <p>Password Management</p>
        </header>
        <main>
            <div class="password-card">
                <h2>Change Password</h2>
                <p class="notice">Passwords must be changed every 90 days per HIPAA policy.</p>
                <form method="post" action="/auth/change-password" autocomplete="off">
                    <div class="form-group">
                        <label for="current_password">Current Password</label>
                        <input type="password" id="current_password" name="current_password" required>
                    </div>
                    <div class="form-group">
                        <label for="new_password">New Password</label>
                        <input type="password" id="new_password" name="new_password" required minlength="12">
                        <span class="help-text">Minimum 12 characters with uppercase, lowercase, number, and symbol</span>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn-primary">Update Password</button>
                    </div>
                </form>
            </div>
        </main>
        <footer>
            <p>&copy; 2025 MedSecure Health Systems. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
