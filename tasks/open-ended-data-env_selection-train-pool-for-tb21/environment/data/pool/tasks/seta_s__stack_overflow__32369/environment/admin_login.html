<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSecure Portal - Administrator Login</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>MedSecure Health Portal</h1>
            <p>System Administration Access</p>
        </header>
        <main>
            <div class="admin-card">
                <h2>Administrator Login</h2>
                <p class="warning">Authorized personnel only. All access is logged and audited.</p>
                <form method="post" action="/admin/login">
                    <div class="form-group">
                        <label for="admin_id">Admin ID</label>
                        <input type="text" id="admin_id" name="admin_id" required>
                    </div>
                    <div class="form-group">
                        <label for="admin_password">Password</label>
                        <input type="password" id="admin_password" name="admin_password" autocomplete="off" required>
                    </div>
                    <div class="form-group">
                        <label for="otp">One-Time Code</label>
                        <input type="text" id="otp" name="otp" required maxlength="6">
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn-primary">Authenticate</button>
                    </div>
                </form>
            </div>
        </main>
        <footer>
            <p>&copy; 2025 MedSecure Health Systems. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
