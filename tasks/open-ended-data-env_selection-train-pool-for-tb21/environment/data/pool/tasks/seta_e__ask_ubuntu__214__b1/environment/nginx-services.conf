server {
    listen 8443 ssl;
    ssl_certificate /app/certs/svc1.crt;
    ssl_certificate_key /app/certs/svc1.key;
    location /health {
        return 200 '{"service":"svc1","status":"healthy"}';
        add_header Content-Type application/json;
    }
}
