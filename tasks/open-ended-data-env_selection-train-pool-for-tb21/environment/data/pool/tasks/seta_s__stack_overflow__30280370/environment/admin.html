<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/lodash@4/lodash.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #fdf2e9; }
    .admin-panel { background: white; padding: 20px; border: 2px solid #e74c3c; border-radius: 4px; }
    .user-list { list-style: none; padding: 0; }
    .user-list li { padding: 8px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <div class="admin-panel">
    <h1>Admin Panel</h1>
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPj/HwADBwIAMCbHYQAAAABJRU5ErkJggg==" alt="admin icon" width="24" height="24">

    <h2>System Users</h2>
    <ul id="user-list" class="user-list">
      <li>Loading...</li>
    </ul>
  </div>

  <script>
    fetch('https://api.dashboard.local/v1/metrics')
      .then(r => r.json())
      .then(data => {
        console.log('Admin metrics loaded:', data);
      })
      .catch(() => {
        console.log('Failed to load admin metrics');
      });

    var ws = new WebSocket('wss://ws.dashboard.local/live');

    var userTpl = _.template('<li><strong><%= name %></strong> - <%= role %></li>');
    var users = [
      { name: 'alice', role: 'admin' },
      { name: 'bob', role: 'viewer' }
    ];
    document.getElementById('user-list').innerHTML = users.map(function(u) { return userTpl(u); }).join('');
  </script>
</body>
</html>
