version: "3.8"

services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    networks:
      - backend_net
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 300s
      timeout: 10s
      retries: 3

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
          gateway: 10.5.0.1
