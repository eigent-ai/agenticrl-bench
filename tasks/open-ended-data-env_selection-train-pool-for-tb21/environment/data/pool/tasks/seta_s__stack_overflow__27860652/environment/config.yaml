project:
  name: "Product Recommender"
  seed: 42
  output_dir: "output"

data:
  input_file: "data/products.csv"
  preprocessed_file: "output/preprocessed.pkl"
  min_token_length: 2

word2vec:
  vector_size: 100
  window: 5
  min_count: 1
  sg: 1
  negative: 0
  hs: 0
  epochs: 50
  seed: 42
  workers: 1
  model_path: "output/word2vec.model"

doc2vec:
  vector_size: 100
  window: 5
  min_count: 1
  dm: 0
  dbow_words: 0
  epochs: 50
  seed: 42
  workers: 1
  model_path: "output/doc2vec.model"

similarity:
  top_n: 10
  output_file: "output/recommendations.json"
