# Example mount configuration with proper settings
# IMPORTANT: Do NOT prefix mode values with 0 (e.g., use 755, not 0755)
# YAML treats 0-prefixed integers as octal: 0755 in YAML = 493 decimal!
description: "Example mount configuration with proper settings"
mounts:
  /mnt/vfat_backup:
    type: vfat
    comment: "For VFAT/FAT32 mounts, permissions set at mount time via umask/fmask"
    exec_mode: 755
    file_mode: 644
    uid: 1000
    gid: 1000
  /mnt/nfs_share:
    type: nfs
    comment: "For NFS mounts, set uid, gid, file_mode, dir_mode"
    exec_mode: 755
    file_mode: 644
    uid: 1000
    gid: 1000
