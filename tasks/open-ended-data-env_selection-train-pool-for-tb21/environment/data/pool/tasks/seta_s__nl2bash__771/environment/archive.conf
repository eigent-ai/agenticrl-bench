[target]
directory = /workspace/archive

[exclude_dirs]
# Directories to exclude entirely (comma-separated names, not paths)
patterns = tests,build,dist,.cache,.secret-keys,node_modules,logs,tmp

[exclude_files]
# File glob patterns to exclude
patterns = *.log,*.pyc,*.tmp,*.bak

[options]
include_hidden = yes
preserve_symlinks = yes
report_broken_symlinks = yes

[manifest]
generate = yes
checksum_algorithm = sha256

[report]
output = /workspace/archive_report.txt
