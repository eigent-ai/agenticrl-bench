server {
    listen 80;
    server_name oldsite.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name oldsite.example.com;

    ssl_certificate /etc/ssl/certs/oldsite.example.com.crt;
    ssl_certificate_key /etc/ssl/private/oldsite.example.com.key;

    root /var/www/oldsite.example.com/html;
    index index.html;

    access_log /var/log/nginx/oldsite.example.com_access.log;
    error_log /var/log/nginx/oldsite.example.com_error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
