# This is the libvirt QEMU driver configuration file.
# Settings in this file are applied when starting the QEMU/KVM driver.
#
# For most settings, changes only take effect at the next libvirtd restart.

# Security driver (default is SELinux; set to 'none' to disable).
#security_driver = "selinux"

# Shared memory (hugetlbfs) mount point for guest memory allocation.
# Uncomment and set the correct path to enable hugepages-backed guest memory.
# The directory must be accessible to the libvirt-qemu user.
#hugetlbfs_mount = "/run/hugepages/kvm"

# Maximum number of VCPUs allowed per guest.
#max_vcpus = 32
