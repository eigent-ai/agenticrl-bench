# Media catalog pipeline configuration
# Colon-separated list of media directories to process
media_dirs=/srv/media/Música:/srv/media/Podcasts
# File extensions considered as media (comma-separated)
catalog_extensions=.mp3,.flac,.ogg,.wav,.m4a
# Patterns to clean up (comma-separated)
cleanup_patterns=*.tmp,.DS_Store,Thumbs.db
