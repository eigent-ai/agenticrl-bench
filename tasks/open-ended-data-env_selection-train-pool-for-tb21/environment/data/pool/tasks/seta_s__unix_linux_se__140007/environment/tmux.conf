# ~/.tmux.conf

# Pane navigation with vim keys
bind-key -n Ctrl-h select-pane -L
bind-key -n Ctrl-j select-pane -D
bind-key -n Ctrl-k select-pane -U
bind-key -n Ctrl-l select-pane -R

# Window navigation with Alt+arrow keys
bind-key -n Alt-Left previous-window
bind-key -n Alt-Right next-window

# Pane resizing with Alt+Shift+arrows
bind-key -n Alt-S-Left resize-pane -L 2
bind-key -n Alt-S-Right resize-pane -R 2
bind-key -n Alt-S-Up resize-pane -U 2
bind-key -n Alt-S-Down resize-pane -D 2

# Performance settings
set -g base-index 1
set -g pane-base-index 1
set -s escape-time 300
set -g history-limit 10000
