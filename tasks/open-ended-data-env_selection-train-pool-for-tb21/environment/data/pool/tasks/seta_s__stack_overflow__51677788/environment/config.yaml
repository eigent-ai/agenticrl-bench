input_dir: "data/raw"
output_dir: "data/augmented"
manifest_path: "data/manifest.json"
target_size: [224, 224]
transforms:
  original: {}
  hflip: {}
  vflip: {}
  rotate90:
    degrees: [0, 180]
  rotate180:
    degrees: [90, 270]
normalize:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
