bash:
  ps1: "\\[\\033[01;32m\\]\\u@\\h\\[\\033[00m\\]:\\[\\033[01;34m\\]\\w\\[\\033[00m\\]\\$ "
  path_dirs:
    - /usr/local/bin
    - /opt/tools/bin
    - $HOME/.local/bin
  aliases:
    ll: "ls -alF"
    la: "ls -A"
    grep: "grep --color=auto"
    gs: "git status"
    gd: "git diff"
  shell_options:
    - histappend
    - checkwinsize
    - globstar

git:
  user:
    name: "Dev User"
    email: "dev@example.com"
  editor: "vim"
  editor: ""
  core:
    autocrlf: input
    whitespace: "trailing-space,space-before-tab"
  color:
    ui: auto
    diff: auto
    status: auto
    branch: auto
  aliases:
    co: checkout
    br: branch
    ci: commit
    st: status
    lg: "log --oneline --graph --decorate"
  push:
    default: simple
    autoSetupRemote: true

tmux:
  prefix: "C-a"
  base_index: 1
  version: "3.4"
  history_limit: 10000
  status:
    position: bottom
    interval: 5

vim:
  settings:
    number: true
    relativenumber: true
    syntax: true
    tabstop: 4
    shiftwidth: 4
    expandtab: true
    autoindent: true
    hlsearch: true
    incsearch: true
    ruler: true
  mappings:
    "<leader>w": ":w<CR>"
    "<leader>q": ":q<CR>"
    "jk": "<Esc>"

inputrc:
  settings:
    completion-ignore-case: "on"
    show-all-if-ambiguous: "on"
    colored-stats: "on"
    mark-symlinked-directories: "on"
  bindings:
    - key: '"\e[1;5C"'
      action: forward-word
      mode: emacs
    - key: '"\e[1;5D"'
      action: backward-word
      mode: emacs
    - key: '"\e[A"'
      action: history-search-backward
      mode: emacs
    - key: '"\e[B"'
      action: history-search-forward
      mode: emacs
    - key: '"\C-l"'
      action: clear-screen
      mode: vi
