# Service configuration file
# Last updated: 2025-03-10

hostname = webserver01
port = 8080
  # Network settings
bind_address = 0.0.0.0
max_connections = 150
timeout = 30  # seconds
retry_count = 3

# Logging
log_level = info
log_file = /var/log/service.log

color = #ff5733
background = #2a2a2a  # dark theme

workers = 4
cache_size = 512
debug = false
