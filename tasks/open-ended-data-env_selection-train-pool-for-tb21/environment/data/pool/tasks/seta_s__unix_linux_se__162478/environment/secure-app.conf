<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerAdmin admin@secure-app.local
        DocumentRoot /var/www/secure-app
        ServerName secure-app.local

        ErrorLog ${APACHE_LOG_DIR}/secure-app-error.log
        CustomLog ${APACHE_LOG_DIR}/secure-app-access.log combined

        SSLEngine on
        SSLProtocol All -SSLv2
        SSLCertificateFile /etc/ssl/certs/secure-app.crt
        SSLCertificateKeyFile /etc/ssl/private/default-server.key
    </VirtualHost>
</IfModule>
