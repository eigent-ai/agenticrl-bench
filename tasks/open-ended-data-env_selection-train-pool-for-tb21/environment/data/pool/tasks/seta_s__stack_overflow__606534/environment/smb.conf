[global]
   workgroup = WORKGROUP
   server string = Project File Server
   security = user
   map to guest = never
   log file = /var/log/samba/log.%m
   max log size = 50
   passdb backend = tdbsam

[project]
   comment = Project Files
   path = /srv/projct
   valid users = devuser
   read only = no
   browseable = yes
   create mask = 0644
   directory mask = 0755
