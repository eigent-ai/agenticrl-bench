[pipeline]
log_dir=/var/log/pipeline
zombie_report=zombie_report.log
max_zombies=0
cleanup_signal=SIGTERM
daemon_binary=/opt/pipeline/ingest_daemon
stages=stage1,stage2

[stage1]
workers=4
data_dir=/data/incoming/stage1

[stage2]
workers=3
data_dir=/data/incoming/stage2

[logging]
audit_report=audit_report.txt
log_level=INFO
