[org/mate/desktop/keybindings/custom0]
binding = <Primary><Alt>t
action = mate-terminal
name = Launch Terminal

[org/mate/marco/global-keybindings]
show-desktop = <Super>d
panel-main-menu = <Alt>F1
run-command-prompt = <Alt>F3
run-command-terminal = <Control><Alt>F1

[org/mate/marco/window-keybindings]
maximize = <Control><Super>Up
tile-to-side-e = <Super>Right
tile-to-side-w = <Super>Left
move-to-workspace-left = <Control><Alt>Left
move-to-workspace-right = <Control><Alt>Right
