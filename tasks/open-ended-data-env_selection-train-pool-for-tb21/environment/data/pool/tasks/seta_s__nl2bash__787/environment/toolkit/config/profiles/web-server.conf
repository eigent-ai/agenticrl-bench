# Web Server Profile
worker_processes=4
worker_connections=2048
keepalive_timeout=30
server_name=webhost.local
listen=80
root=/var/www/html
error_log=/var/log/nginx/error.log
access_log=/var/log/nginx/access.log
net.core.somaxconn=65535
net.ipv4.tcp_max_syn_backlog=65535
vm.swappiness=10
nofile_soft=65535
nofile_hard=65535
nproc_soft=4096
nproc_hard=8192
