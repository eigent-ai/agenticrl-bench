<VirtualHost *:80>
    ServerName tenant_a.local
    DocumentRoot /var/www/tenant_a
    <Directory /var/www/tenant_a>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php-fpm-tenant_a.sock|fcgi://localhost"
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/tenant_a_error.log
    CustomLog ${APACHE_LOG_DIR}/tenant_a_access.log combined
</VirtualHost>
