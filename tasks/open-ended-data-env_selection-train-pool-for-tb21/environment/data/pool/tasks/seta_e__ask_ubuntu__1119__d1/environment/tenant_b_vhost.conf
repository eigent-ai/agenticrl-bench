<VirtualHost *:80>
    ServerName tenant_b.local
    DocumentRoot /var/www/tenant_b
    <Directory /var/www/tenant_b>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php-fpm-tenant_b.sock|fcgi://localhost"
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/tenant_b_error.log
    CustomLog ${APACHE_LOG_DIR}/tenant_b_access.log combined
</VirtualHost>
