<VirtualHost *:80>
    ServerName tenant_c.local
    DocumentRoot /var/www/tenant_c
    <Directory /var/www/tenant_c>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php-fpm-tenant_c.sock|fcgi://localhost"
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/tenant_c_error.log
    CustomLog ${APACHE_LOG_DIR}/tenant_c_access.log combined
</VirtualHost>
