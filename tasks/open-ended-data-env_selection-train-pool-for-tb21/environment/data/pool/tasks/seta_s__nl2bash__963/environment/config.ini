# Disk monitoring configuration
CACHE_DIR="/var/cache/diskmon"
REPORT_FILE="/var/reports/disk_report.json"
LOG_FILE="/var/log/diskmon/diskmon.log"
ALERT_FILE="/var/log/diskmon/alerts.log"
CLEANUP_LOG="/var/log/diskmon/cleanup.log"

# Default threshold - alert if usage exceeds this percentage
DEFAULT_THRESHOLD=95

# Per-filesystem thresholds (override default)
# Variable name format: THRESHOLD_<mount_path_with_slashes_replaced_by_underscores>
THRESHOLD_mnt_data_webapp=85
THRESHOLD_mnt_data_database=80
THRESHOLD_mnt_data_log=80
THRESHOLD_mnt_data_media=75
THRESHOLD_mnt_data_backups=80
THRESHOLD_mnt_data_projects=80
