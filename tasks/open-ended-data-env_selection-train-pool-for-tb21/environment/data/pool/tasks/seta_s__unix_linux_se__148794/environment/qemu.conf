# Master configuration file for QEMU

# VNC/SPICE TLS settings
spice_tls = 0
spice_tls_x509_cert_dir = "/etc/pki/libvirt-spice"

# Security driver
security_driver = "none"

# User/group for QEMU processes
user = "root"
group = "root"

# Whether to have QEMU set its process name
set_process_name = 1

# VNC auto unix socket
vnc_auto_unix_socket = 1

# Max number of processes
max_processes = 0

# Max number of files
max_files = 0
