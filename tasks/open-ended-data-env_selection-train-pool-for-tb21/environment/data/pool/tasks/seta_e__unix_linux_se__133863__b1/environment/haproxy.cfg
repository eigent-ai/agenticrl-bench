global
    log stdout format raw local0 info
    maxconn 256

defaults
    log     global
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    retries 3

frontend ssh_frontend
    bind *:3025
    mode http
    default_backend ssh_bakend

backend ssh_backend
    mode http
    server sshd1 127.0.0.1:22 check
