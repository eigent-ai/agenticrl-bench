Section "InputClass"
    Identifier "usb-touchpad-06cb"
    MatchProduct "Synaptics, Inc."
    MatchVendor "USB-HID Touchpad"
    MatchIsTouchpad "on"
    Driver "synaptics"
EndSection

Section "InputClass"
    Identifier "usb-keyboard-04f2"
    MatchProduct "Chicony Electronics Co., Ltd."
    MatchVendor "USB Keyboard"
    MatchIsKeyboard "on"
    Driver "evdev"
EndSection

Section "InputClass"
    Identifier "usb-hub-05e3"
    MatchProduct "Genesys Logic, Inc."
    MatchVendor "USB2.0 Hub"
    Driver "evdev"
EndSection
