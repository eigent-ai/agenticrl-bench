UI menu.c32
MENU TITLE Legacy Boot System v1.0

DEFAULT default
TIMEOUT 300
PROMPT 0

LABEL default
    MENU LABEL Boot Default
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.img root=/dev/ram0 quiet

LABEL safegraphics
    MENU LABEL Boot with Safe Graphics
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.img root=/dev/ram0 nomodeset quiet
