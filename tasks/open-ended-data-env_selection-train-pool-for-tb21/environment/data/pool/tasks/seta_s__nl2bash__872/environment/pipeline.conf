[build]
manifest_path = /srv/docs/output/manifest.txt

# Manifest format requirements:
#   - One file path per line
#   - Paths relative to content directory (no ./ prefix)
#   - Only regular files, not directories
#   - Alphabetically sorted
#   - Must include ALL changed content files EXCEPT auto-generated
#     locale directories (en/ and es/ only)
#   - Directories like enterprise/, essential-guides/ etc. are NOT
#     locale directories and MUST be included

trigger_on_change = true
rebuild_timeout = 300
