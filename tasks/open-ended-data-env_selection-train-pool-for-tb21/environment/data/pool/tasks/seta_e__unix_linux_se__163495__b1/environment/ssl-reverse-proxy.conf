# SSL Reverse Proxy configuration for backend application
# This server block terminates SSL and forwards traffic to the internal app server.

upstream backend_app {
    server 127.0.0.1:8080;
}

server {
    listen 443 ssl;
    server_name proxy.example.com;

    # SSL Certificate Configuration
    # Uncomment and verify paths to enable SSL termination
    #ssl_certificate /etc/nginx/ssl/proxy.crt;
    #ssl_certificate_key /etc/nginx/ssl/proxy.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        # Reverse proxy to backend application
        # Uncomment proxy_pass to enable forwarding
        #proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
