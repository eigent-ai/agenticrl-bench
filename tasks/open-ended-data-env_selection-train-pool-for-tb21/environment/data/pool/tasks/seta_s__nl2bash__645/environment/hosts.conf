# Network Health Monitor - Host Configuration
# Format: hostname  group=<group>  priority=<level>
#
# Hosts are pinged sequentially. Priority determines alert behavior:
#   critical/high = generate alert on failure
#   medium/low    = log only

# === Production Web Tier ===
web1.internal   group=web     priority=high
web2.internal   group=web     priority=high

# === Database Tier ===
db1.internal    group=db      priority=critical
db2.internal    group=db      priority=critical

# === Cache Layer ===
cache1.internal group=cache   priority=medium

# === Infrastructure ===
backup.internal group=infra   priority=low
api.internal    group=api     priority=high
