buildfarm:
  name: "CI Build Farm"
  max_workers: 5
  worker_timeout_seconds: 300
  graceful_shutdown_signal: SIGTERM
  force_kill_after_seconds: 5
  pid_dir: /opt/buildfarm/pids
  log_dir: /opt/buildfarm/logs
  status_dir: /opt/buildfarm/status
  lock_file: /opt/buildfarm/.build_lock
  worker_script: /opt/buildfarm/workers/csp_build.py
  orchestrator_script: /opt/buildfarm/build_orchestrator.py
