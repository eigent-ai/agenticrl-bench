# Pipeline Configuration
# Format: pattern | command [and command]*
# Use {} as placeholder for the matched filename

src/*.txt : /opt/filewatch/processors/concat.sh {} combined.txt
src/*.csv : /opt/filewatch/processors/transform {} cleaned
src/config.ini : /opt/filewatch/processors/validate.sh {} and /opt/filewatch/processors/concat.sh {} config_backup.txt
src/data_and_notes.dat : /opt/filewatch/processors/concat.sh {} archive.txt
