apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runner-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: runner.example.com
    http:
      paths:
      - path: /
        pathType: Exact
        backend:
          service:
            name: runner-service
            port:
              number: 80
