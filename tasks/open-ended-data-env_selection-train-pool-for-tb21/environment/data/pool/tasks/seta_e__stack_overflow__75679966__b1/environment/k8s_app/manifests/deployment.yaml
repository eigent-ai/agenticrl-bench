apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: runner-app
  labels:
    app: runner
spec:
  replicas: 3
  rollbackTo:
    revision: 0
  template:
    metadata:
      labels:
        app: runner
    spec:
      containers:
      - name: runner
        image: runner-app:1.0
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
