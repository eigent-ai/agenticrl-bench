input_dir: "data/raw"
output_dir: "data/augmented"
manifest_path: "data/manifest.json"
target_samples: 44100
sample_rate: 44100
transforms:
  original: {}
  reverse: {}
  speed_2x:
    factor: [0.5, 1.5]
  amplify:
    gain: [0.1, 0.5]
  fade_in:
    duration_fraction: 0.25
normalize:
  method: "zscore"
