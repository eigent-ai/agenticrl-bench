[unix_http_server]
file=/opt/jobsystem/var/run/supervisor.sock

[supervisord]
logfile=/opt/jobsystem/var/log/supervisord.log
pidfile=/opt/jobsystem/var/run/supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///opt/jobsystem/var/run/supervisor.sock

[program:batch-processor]
command=python3 /opt/jobsystem/bin/worker.py --pool batch --started-at 2026-05-05T08:30:00
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=false
autorestart=true
directory=/opt/jobsystem
stdout_logfile=/opt/jobsystem/var/log/worker_%(process_num)02d.log
stderr_logfile=/opt/jobsystem/var/log/worker_%(process_num)02d_err.log
stopwaitsecs=10
