<VirtualHost *:8082>
    ServerName api.internal
    DocumentRoot /var/www/api

    <Directory /var/www/api>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/api-error.log
    CustomLog ${APACHE_LOG_DIR}/api-access.log combined
</VirtualHost>
