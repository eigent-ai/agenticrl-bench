<VirtualHost *:8081>
    ServerName docs.internal
    DocumentRoot /var/www/docs

    <Directory /var/www/docs>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/docs-error.log
    CustomLog ${APACHE_LOG_DIR}/docs-access.log combined
</VirtualHost>
