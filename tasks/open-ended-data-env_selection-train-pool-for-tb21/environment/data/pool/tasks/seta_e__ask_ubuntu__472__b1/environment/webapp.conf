# Virtual host configuration for the web application
#
# This file configures Apache2 to serve the web application
# from /var/www/webapp/

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/webapp

    # Access control for the document root
    #
    # Choose the appropriate access policy below.
    #
    # NOTE: Only ONE Require directive should be active.
    #
    <Directory /var/www/webapp/>
        Options Indexes FollowSymLinks
        AllowOverride None

        # For restricted environments (deny all access):
        #Require all denied

        # For open access (allow all users):
        #Require all granted
    </Directory>

    # Logging configuration
    ErrorLog ${APACHE_LOG_DIR}/webapp_error.log
    CustomLog ${APACHE_LOG_DIR}/webapp_access.log combined
</VirtualHost>
