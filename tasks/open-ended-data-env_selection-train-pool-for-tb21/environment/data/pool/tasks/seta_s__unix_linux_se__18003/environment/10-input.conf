Section "ServerFlags"
    Option "AutoAddDevices" "True"
    Option "AutoEnableDevices" "False"
    Option "AllowEmptyInput" "False"
EndSection

Section "InputDevice"
    Identifier  "Container-Keyboard"
    Driver      "keyboard"
    Option      "XkbLayout"  "us"
    Option      "XkbModel"   "pc105"
    Option      "XkbOptions" "terminate:ctrl_alt_bksp"
    Option      "Device"     "/dev/input/event0"
EndSection

Section "InputDevice"
    Identifier  "Container-Mouse"
    Driver      "mouse"
    Option      "Device"     "/dev/mice"
    Option      "ZAxisMapping" "4 5"
    Option      "Buttons"    "5"
EndSection

Section "ServerLayout"
    Identifier  "Container-Layout"
    InputDevice "Container-Keyboard" "CoreKeyboard"
    InputDevice "Container-Mouse"    "CorePointer"
EndSection
