# LXC Container Configuration - X11 Desktop
# GPU-accelerated desktop environment inside LXC

lxc.include = /usr/share/lxc/config/common.conf

# Container identity
lxc.uts.name = desktop-worker
lxc.arch = amd64

# Network
lxc.net.0.type = veth
lxc.net.0.link = lxcbr0
lxc.net.0.flags = up
lxc.net.0.hwaddr = 00:16:3e:xx:xx:xx

# Filesystem
lxc.rootfs.path = dir:/var/lib/lxc/desktop-worker/rootfs
lxc.rootfs.backend = dir

# Device access rules
# TTY devices for virtual terminals
lxc.cgroup2.devices.allow = c 5:* rwm

# NVIDIA GPU devices
lxc.cgroup2.devices.allow = c 196:* rwm

# DRI (Direct Rendering Infrastructure)
lxc.cgroup2.devices.allow = c 226:* rwm

# Framebuffer
lxc.cgroup2.devices.allow = c 29:* rwm

# Console
lxc.cgroup2.devices.allow = c 5:1 rwm

# Mount entries
lxc.mount.auto = cgroup:mixed proc:mixed sys:mixed
lxc.mount.entry = /dev/dri dev/dri none bind,optional,create=dir

# Security
lxc.apparmor.profile = unconfined
lxc.cap.drop =
