Section "Monitor"
    Identifier  "Container-Monitor"
    HorizSync   30.0 - 83.0
    VertRefresh 56.0 - 76.0
    Modeline    "1920x1080_60" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
    Option      "DPMS" "false"
EndSection

Section "Device"
    Identifier  "Container-GPU"
    Driver      "nvidia"
    BusID       "PCI:0:2:0"
    Option      "AllowEmptyInitialConfiguration" "True"
EndSection

Section "Screen"
    Identifier  "Container-Screen"
    Device      "Container-GPU"
    Monitor     "Container-Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080_60" "1280x720"
    EndSubSection
EndSection
