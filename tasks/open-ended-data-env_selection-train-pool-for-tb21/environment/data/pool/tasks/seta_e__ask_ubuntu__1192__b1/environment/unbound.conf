server:
    verbosity: 1
    interface: 127.0.0.1
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # DNSSEC validation
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # Hide identity and version
    hide-identity: yes
    hide-version: yes

    # Include forwarding configuration
    include: "/etc/unbound/conf.d/forward-zones.conf"
