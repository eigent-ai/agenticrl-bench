server {
    listen 8080;
    server_name this-is-an-extremely-long-subdomain-name-that-definitely-exceeds-the-default-hash-bucket-size-of-sixty-four-bytes.another-very-long-second-level-subdomain-for-the-application.internal-infrastructure-services.company-production-environment.example.com;

    root /var/www/longdomain;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
