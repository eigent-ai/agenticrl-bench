<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - {% block title %}Home{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
        .navbar { background: #2c3e50; color: white; padding: 10px 20px; }
        .navbar a { color: white; text-decoration: none; margin-right: 15px; }
        .container { max-width: 960px; margin: 20px auto; padding: 0 20px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('main.index') }}">TaskFlow</a>
        <a href="{{ url_for('main.tasks') }}">Tasks</a>
        <a href="{{ url_for('auth.login') }}">Login</a>
        <a href="{{ url_for('admin.dashboard') }}">Admin</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
