{% extends "base.html" %}
{% block title %}Tasks{% endblock %}
{% block content %}
<h1>Task List</h1>
<p>Manage your tasks below. <a href="{{ url_for('auth.login') }}">Sign in</a> to create new tasks.</p>
<div id="task-list">
    <p>Loading tasks...</p>
</div>
<script>
    fetch('/tasks')
        .then(r => r.json())
        .then(data => {
            const el = document.getElementById('task-list');
            if (data.length === 0) {
                el.innerHTML = '<p>No tasks yet.</p>';
            } else {
                el.innerHTML = '<ul>' + data.map(t => '<li>' + t.title + ' [' + t.status + ']</li>').join('') + '</ul>';
            }
        });
</script>
{% endblock %}
