app:
  name: file_vault
  version: 1.2.0
  debug: false

backup:
  source_dir: ./source
  output_dir: ./backup_out
  manifest_name: manifest.json
  overwrite_existing: true

logging:
  level: info
  file: /var/log/file_vault.log
  max_size_mb: 10
  rotate_count: 5

checksums:
  algorithm: sha256
  verify_after_copy: true
  include_manifest: false

filters:
  exclude_patterns:
    - "*.tmp"
    - "*.swp"
    - ".DS_Store"
  include_hidden: false
  max_file_size_mb: 100
