[rotation]
# Glob pattern for files to exclude from rotation
exclude_pattern=*-archive-*

# Directories
log_dir=/srv/log_archive/logs
report_dir=/srv/log_archive/report

[manifest]
# Path to the tracking manifest
path=/srv/log_archive/manifest.tsv
# Update manifest after rotation
update=true

[report]
# Generate summary report after rotation
generate=true
output=rotation_summary.txt
