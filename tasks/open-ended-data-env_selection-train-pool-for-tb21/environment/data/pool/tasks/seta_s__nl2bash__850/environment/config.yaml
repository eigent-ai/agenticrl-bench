application:
  name: data-processor
  version: 2.4.1
  environment: production

processing:
  max_file_size_mb: 50
  batch_size: 100
  parallel_workers: 4
  extensions:
    - .txt
    - .csv
    - .json
    - .xml

output:
  format: json
  directory: build/output
  include_checksums: true

logging:
  level: INFO
  file: logs/app.log
  max_size_mb: 10
  rotation_count: 5
