<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .summary { margin: 1em 0; padding: 1em; background: #e8f5e9; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Processing Report</h1>
    <div class="summary">
        <p>Total files processed: <strong>{{total_files}}</strong></p>
        <p>Total size: <strong>{{total_size}}</strong></p>
        <p>Generated: <strong>{{timestamp}}</strong></p>
    </div>
    <table>
        <thead>
            <tr>
                <th>File</th>
                <th>Size</th>
                <th>Hash</th>
                <th>Type</th>
            </tr>
        </thead>
        <tbody>
            {{#each files}}
            <tr>
                <td>{{path}}</td>
                <td>{{size}}</td>
                <td>{{hash}}</td>
                <td>{{extension}}</td>
            </tr>
            {{/each}}
        </tbody>
    </table>
</body>
</html>
