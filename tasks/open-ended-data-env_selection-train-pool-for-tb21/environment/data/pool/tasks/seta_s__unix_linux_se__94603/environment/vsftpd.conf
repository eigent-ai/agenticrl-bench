listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
chroot_local_user=YES
user_sub_token=$USER
local_root=/var/www/ftp/$USER
pasv_enable=NO
pasv_min_port=50000
pasv_max_port=50100
pasv_address=127.0.0.1
xferlog_enable=NO
seccomp_sandbox=NO
pam_service_name=vsftpd
