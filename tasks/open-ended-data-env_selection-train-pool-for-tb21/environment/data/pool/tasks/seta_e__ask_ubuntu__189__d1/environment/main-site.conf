<VirtualHost *:80>
    ServerName main-site.local
    DocumentRoot /var/www/html

    <Directory /var/www/main-site>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On

    ErrorLog ${APACHE_LOG_DIR}/main-site-error.log
    CustomLog ${APACHE_LOG_DIR}/main-site-access.log combined
</VirtualHost>
