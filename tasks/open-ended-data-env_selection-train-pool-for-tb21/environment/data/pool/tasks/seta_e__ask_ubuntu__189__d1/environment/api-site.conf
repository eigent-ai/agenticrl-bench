<VirtualHost *:8080>
    ServerName api-site.local
    DocumentRoot /var/www/api-site

    <Directory /var/www/api-site>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/api-site-error.log
    CustomLog ${APACHE_LOG_DIR}/api-site-access.log combined
</VirtualHost>
