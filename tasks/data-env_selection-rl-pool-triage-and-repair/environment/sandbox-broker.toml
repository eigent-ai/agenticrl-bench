# Sandbox service for this machine (installed as /etc/sandbox-broker/policy.toml, root:root 0644).
# One sandbox per task run, built from the task's environment/ directory as registered for the pool
# (the hash list is generated when this image is built). Sandboxes have no network.

socket_path = "/run/sandbox-broker.sock"
socket_mode = "0666"

[limits]
max_concurrent = 32
max_total_creates = 0
default_cpu = 1.0
max_cpu = 2.0
default_memory_mb = 2048
max_memory_mb = 4096
default_timeout_s = 3600
max_timeout_s = 3600
idle_timeout_s = 600
default_exec_timeout_s = 600
max_exec_timeout_s = 1800
budget_sandbox_seconds = 400000
max_file_bytes = 67108864
max_output_bytes = 8388608

[images]
allow = []
build_contexts_file = "build-contexts.txt"

[sandbox]
network = "none"
hostname = ""  # keep the platform's own hostname (no normalisation)
