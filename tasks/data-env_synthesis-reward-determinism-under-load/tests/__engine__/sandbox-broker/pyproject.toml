[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "sandbox-broker"
version = "0.3.0"
description = "Sandbox gate: a local, platform-neutral service for network-isolated task sandboxes; holds the platform credentials on behalf of workloads"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
modal = ["modal==1.6.1"]
daytona = ["daytona==0.223.1"]
# the harbor backend: installed into its own root-only venv (/opt/sandbox-broker/harbor-venv), never with
# "all", because its SDKs need other versions of packages the modal and daytona backends use
harbor = ["harbor[cloud] @ https://github.com/harbor-framework/harbor/archive/3e30cca047a4d0dc1fb209bf5a74ff761b794b90.tar.gz"]
all = ["modal==1.6.1", "daytona==0.223.1"]
daemon = ["modal==1.6.1"]
test = ["pytest>=8"]
[project.scripts]
sandbox = "sandbox_broker.cli:main"
sandbox-broker = "sandbox_broker.__main__:main"
[tool.setuptools]
packages = ["sandbox_broker", "sandbox_broker.backends"]
