tools:
  - class_name: "verl.tools.sandbox_fusion_tools.SandboxFusionTool"
    config:
      sandbox_fusion_url: "http://sandbox-gw.internal:8080/run_code"
      num_workers: 64
      enable_global_rate_limit: true
      rate_limit: 64
      default_timeout: 60
      default_language: "bash"
      memory_limit_mb: 2048
      type: native
    tool_schema:
      type: "function"
      function:
        name: "bash"
        description: "Run a bash command in the task workspace and return its output."
        parameters:
          type: "object"
          properties:
            command:
              type: "string"
              description: "The command to run."
          required: ["command"]
